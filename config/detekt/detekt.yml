# Built on detekt defaults (buildUponDefaultConfig). Compose-friendly tweaks only.
naming:
  MatchingDeclarationName:
    active: false  # ktlint standard:filename covers this; Compose files pair a model with its composables
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    # Compose screens branch on UI state by design (as LongMethod above); plain `when` mappings are not complexity.
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    active: false
style:
  MagicNumber:
    active: false
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
