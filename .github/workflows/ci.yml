name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-checks:
    name: ktlint · detekt · Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt lint checkStoreListings --continue
      - name: Build-logic unit tests (store listing rules)
        run: ./gradlew -p build-logic :convention:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit + Compose (Robolectric) + screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and screenshot verification
        # Golden screenshots (en/ar, light/dark, phone/tablet/TV) live in */src/test/screenshots and are
        # recorded on Linux (see scripts/record-screenshots.sh). verify fails on any pixel diff.
        run: ./gradlew testDebugUnitTest testQaDebugUnitTest testQaGoogleDebugUnitTest -Proborazzi.test.verify=true --continue
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

  assemble:
    name: Assemble every app and flavour
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APKs + unsigned release bundles (R8 on)
        # Every app × flavour in one build ran D8/R8 out of the 4 GB heap (OutOfMemoryError on main, 2026-11-15)
        # and then stalled. The runner has 16 GB: a bigger heap and three workers keep it inside that.
        run: ./gradlew assembleDebug bundleRelease --max-workers=3 "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          # The Admin app is staff-only (AUN-ADMIN-NATIVE, AD10): never a downloadable APK from this public repo.
          path: |
            **/build/outputs/apk/**/debug/*.apk
            !admin-mobile/**
          retention-days: 7
      - name: Studio release variant (R8), debug-signed for testers
        # The release build type with R8 and resource shrinking, signed with this run's debug key so
        # it installs. Not for Play. Proves the release variant (keep rules, JNA/UniFFI) works on every PR.
        run: |
          ./gradlew :studio-mobile:assembleQaRelease :studio-mobile:assembleProdRelease -PaunDebugSignRelease=true
      - uses: actions/upload-artifact@v4
        with:
          name: studio-apks-debug-signed
          path: |
            studio-mobile/build/outputs/apk/qa/debug/*.apk
            studio-mobile/build/outputs/apk/*/release/*.apk
          retention-days: 14

  instrumented:
    name: Instrumented tests on emulator (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APKs
        run: ./gradlew :viewer-mobile:assembleQaDebug :viewer-mobile:assembleQaDebugAndroidTest :studio-mobile:assembleQaDebugAndroidTest :admin-mobile:assembleQaDebugAndroidTest :viewer-tv:assembleQaGoogleDebugAndroidTest
      # Tests against the deployed QA (scripts/qa-deployed-tests.sh) are left out: they run only on
      # releases (qa-e2e.yml). Owner rule 2026-11-13: no E2E against deployed QA on PRs, main or a schedule.
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/ci-emulator.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/outputs/connected_android_test_additional_output/
            emulator-screenshots/
          if-no-files-found: ignore
