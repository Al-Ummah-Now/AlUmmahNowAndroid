name: Record screenshots

# Re-records Roborazzi goldens on the CI image (Linux) and commits them to the branch it runs on.
# Run it from a PR branch after an intentional UI change: Actions → Record screenshots → branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: { echo "::error::Run this on a PR branch"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew recordRoborazziDebug recordRoborazziQaDebug recordRoborazziQaGoogleDebug --continue
      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/src/test/screenshots/**'
          git diff --cached --quiet && { echo "No screenshot changes"; exit 0; }
          git commit -m "test: re-record screenshot goldens on Linux"
          git push
