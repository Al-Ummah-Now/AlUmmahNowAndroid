name: Release

# Releases are cut ONLY from a vYYYY.MM.DD[.N] tag on main. Never publish by hand.
#   github-release: Studio APK + AAB attached to a GitHub Release. Signed with the upload key when
#                   its secrets exist; otherwise with the pre-release key and marked as a pre-release
#                   ("debug-signed": installable for testers, never accepted by Play).
#   play:           prod bundles to the Play internal track. Runs only when the upload key AND the
#                   Play service account are configured; until then it is skipped with a warning.
#   Admin app:      Play internal testing ONLY (wiki AUN-ADMIN-NATIVE, AD10). Never attached to a GitHub
#                   Release and never uploaded as an artifact: the repo is public and the app is staff-only.
#                   Published in the play job once the owner has created the app in Play Console (repo
#                   variable ADMIN_PLAY_READY=true); its Firebase config comes from ADMIN_GOOGLE_SERVICES_JSON.
on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.ver.outputs.code }}
      name: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Version from tag
        id: ver
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]{1,2})?$ ]] || { echo "::error::Tag must be vYYYY.MM.DD[.N]"; exit 1; }
          name="${GITHUB_REF_NAME#v}"
          # versionCode = days since 2026-01-01 * 100 + build suffix: monotonic and fits in an int.
          y=${name:0:4}; m=${name:5:2}; d=${name:8:2}; n=$(echo "$name" | cut -d. -f4); n=${n:-0}
          days=$(( ( $(date -ud "$y-$m-$d" +%s) - $(date -ud 2026-01-01 +%s) ) / 86400 ))
          echo "code=$(( days * 100 + n ))" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (upload key, else pre-release key)
        id: key
        env:
          UPLOAD_KS: ${{ secrets.AUN_UPLOAD_KEYSTORE_BASE64 }}
          PRE_KS: ${{ secrets.AUN_PRERELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KS" ]; then
            echo "$UPLOAD_KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "kind=upload" >> "$GITHUB_OUTPUT"
          elif [ -n "$PRE_KS" ]; then
            echo "$PRE_KS" | base64 -d > "$RUNNER_TEMP/prerelease.jks"
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key configured: the GitHub release is a pre-release signed with the pre-release key (see docs/RELEASE.md)."
          else
            echo "::error::Neither AUN_UPLOAD_KEYSTORE_BASE64 nor AUN_PRERELEASE_KEYSTORE_BASE64 is set"; exit 1
          fi
      - name: Build Studio (prod APK + AAB, QA APK)
        env:
          AUN_UPLOAD_KEYSTORE_PATH: ${{ steps.key.outputs.kind == 'upload' && format('{0}/upload.jks', runner.temp) || '' }}
          AUN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.AUN_UPLOAD_KEYSTORE_PASSWORD }}
          AUN_UPLOAD_KEY_ALIAS: ${{ secrets.AUN_UPLOAD_KEY_ALIAS }}
          AUN_UPLOAD_KEY_PASSWORD: ${{ secrets.AUN_UPLOAD_KEY_PASSWORD }}
          AUN_PRERELEASE_KEYSTORE_PATH: ${{ steps.key.outputs.kind == 'prerelease' && format('{0}/prerelease.jks', runner.temp) || '' }}
          AUN_PRERELEASE_KEYSTORE_PASSWORD: ${{ secrets.AUN_PRERELEASE_KEYSTORE_PASSWORD }}
          AUN_PRERELEASE_KEY_ALIAS: ${{ secrets.AUN_PRERELEASE_KEY_ALIAS }}
          AUN_PRERELEASE_KEY_PASSWORD: ${{ secrets.AUN_PRERELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :studio-mobile:assembleProdRelease :studio-mobile:bundleProdRelease :studio-mobile:assembleQaRelease
          -PversionCode="${{ needs.verify.outputs.code }}" -PversionName="${{ needs.verify.outputs.name }}"
      - name: Collect, verify signatures, checksum
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.name }}"
          mkdir dist
          cp studio-mobile/build/outputs/apk/prod/release/studio-mobile-prod-release.apk "dist/AlUmmahNowStudio-$v.apk"
          cp studio-mobile/build/outputs/bundle/prodRelease/studio-mobile-prod-release.aab "dist/AlUmmahNowStudio-$v.aab"
          cp studio-mobile/build/outputs/apk/qa/release/studio-mobile-qa-release.apk "dist/AlUmmahNowStudio-$v-qa.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in dist/*.apk; do "$BT/apksigner" verify --print-certs "$a" | grep -m1 'certificate SHA-256'; done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.key.outputs.kind }}
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.name }}"
          if [ "$KIND" = upload ]; then
            flags=(--latest)
            note="Signed with the Al Ummah Now upload key."
          else
            flags=(--prerelease)
            note="**Pre-release, debug-signed** with the CI pre-release key: install it for testing (allow installs from this source). Play will not accept it, and it cannot update a Play-installed copy."
          fi
          cat > notes.md <<NOTES
          Al Ummah Now Studio $v (Android phone and tablet).

          $note

          - \`AlUmmahNowStudio-$v.apk\`: production (videos.alummahnow.net)
          - \`AlUmmahNowStudio-$v-qa.apk\`: QA environment (installs next to production)
          - \`AlUmmahNowStudio-$v.aab\`: bundle for Play
          - \`SHA256SUMS.txt\`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "Studio $v" --notes-file notes.md "${flags[@]}" --verify-tag

  play:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-release
    steps:
      - name: Upload key and Play service account configured?
        id: ready
        env:
          KEYSTORE: ${{ secrets.AUN_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AUN_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUN_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AUN_UPLOAD_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for v in KEYSTORE KS_PASS KEY_ALIAS KEY_PASS PLAY_JSON; do [ -n "${!v}" ] || missing+=("$v"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Play internal track skipped: missing ${missing[*]} (docs/RELEASE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.ready.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        if: steps.ready.outputs.ok == 'true'
        env:
          KEYSTORE: ${{ secrets.AUN_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Publish prod bundles to the Play internal track
        if: steps.ready.outputs.ok == 'true'
        env:
          AUN_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AUN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.AUN_UPLOAD_KEYSTORE_PASSWORD }}
          AUN_UPLOAD_KEY_ALIAS: ${{ secrets.AUN_UPLOAD_KEY_ALIAS }}
          AUN_UPLOAD_KEY_PASSWORD: ${{ secrets.AUN_UPLOAD_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          ./gradlew
          :viewer-mobile:publishProdReleaseBundle
          :viewer-tv:publishProdGoogleReleaseBundle
          :studio-mobile:publishProdReleaseBundle
          -PversionCode="${{ needs.verify.outputs.code }}" -PversionName="${{ needs.verify.outputs.name }}"
      - name: Admin app to the Play internal track (staff only, never a public APK)
        if: steps.ready.outputs.ok == 'true' && vars.ADMIN_PLAY_READY == 'true'
        env:
          AUN_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AUN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.AUN_UPLOAD_KEYSTORE_PASSWORD }}
          AUN_UPLOAD_KEY_ALIAS: ${{ secrets.AUN_UPLOAD_KEY_ALIAS }}
          AUN_UPLOAD_KEY_PASSWORD: ${{ secrets.AUN_UPLOAD_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES: ${{ secrets.ADMIN_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # Firebase (FCM review alerts). Without it the app ships with alerts off and says so in Settings.
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > admin-mobile/google-services.json
          else
            echo "::warning::ADMIN_GOOGLE_SERVICES_JSON is not set: the Admin app is published with review alerts off."
          fi
          ./gradlew :admin-mobile:publishProdReleaseBundle \
            -PversionCode="${{ needs.verify.outputs.code }}" -PversionName="${{ needs.verify.outputs.name }}"
          rm -f admin-mobile/google-services.json
      - name: Admin app not published yet
        if: steps.ready.outputs.ok == 'true' && vars.ADMIN_PLAY_READY != 'true'
        run: |
          echo "::warning::Admin app skipped: create net.alummahnow.admin in Play Console, then set the repo variable ADMIN_PLAY_READY=true (docs/RELEASE.md)."
      - name: Fire TV APK (uploaded to Amazon by the owner until an Appstore API key exists)
        if: steps.ready.outputs.ok == 'true'
        env:
          AUN_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          AUN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.AUN_UPLOAD_KEYSTORE_PASSWORD }}
          AUN_UPLOAD_KEY_ALIAS: ${{ secrets.AUN_UPLOAD_KEY_ALIAS }}
          AUN_UPLOAD_KEY_PASSWORD: ${{ secrets.AUN_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :viewer-tv:assembleProdAmazonRelease -PversionCode="${{ needs.verify.outputs.code }}" -PversionName="${{ needs.verify.outputs.name }}"
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fire-tv-apk
          path: viewer-tv/build/outputs/apk/prodAmazon/release/*.apk
